<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebook 项目代码详解</title>
<style>
:root {
  --sidebar-bg: #f7f4ed;
  --page-bg: #fffdf9;
  --text: #23282d;
  --muted: #6f746f;
  --border: #ddd6c9;
  --accent: #0f766e;
  --accent-soft: #dff3ef;
  --code-bg: #f1efe8;
  --sidebar-width: 340px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--page-bg);
  color: var(--text);
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  line-height: 1.75;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  display: flex;
  width: var(--sidebar-width);
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--sidebar-bg);
  transition: transform 180ms ease;
}

.sidebar-header {
  padding: 20px 20px 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  margin: 0;
  font-size: 19px;
  line-height: 1.35;
}

.sidebar-header p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.search-wrap {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}

#tocSearch {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fffefa;
  color: var(--text);
  font: inherit;
  outline: none;
}

#tocSearch:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.term-search-wrap {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: #f2eee4;
}

.term-search-wrap label {
  display: block;
  margin-bottom: 6px;
  color: #4d554f;
  font-size: 12px;
  font-weight: 700;
}

#termSearch {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fffefa;
  color: var(--text);
  font: inherit;
  outline: none;
}

#termSearch:focus {
  border-color: #d49b32;
  box-shadow: 0 0 0 3px #fff0cf;
}

.term-results {
  max-height: 250px;
  margin-top: 8px;
  overflow: auto;
}

.term-result {
  display: block;
  width: 100%;
  margin: 4px 0;
  padding: 8px 9px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: #fffdf8;
  color: var(--text);
  text-align: left;
  font: inherit;
  cursor: pointer;
}

.term-result:hover,
.term-result:focus {
  border-color: #d9b96d;
  background: #fff4d7;
}

.term-result strong {
  display: block;
  color: #7a4f0d;
  font-size: 13px;
}

.term-result span {
  display: block;
  margin-top: 2px;
  color: #626861;
  font-size: 12px;
  line-height: 1.45;
}

.term-empty {
  padding: 5px 2px;
  color: var(--muted);
  font-size: 12px;
}

.toc-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 10px 10px 28px;
}

#TOC {
  font-size: 14px;
  line-height: 1.45;
}

#TOC ul {
  margin: 0;
  padding-left: 10px;
  list-style: none;
}

#TOC > ul {
  padding-left: 0;
}

#TOC li {
  margin: 2px 0;
}

#TOC a {
  display: block;
  padding: 5px 8px;
  border-radius: 5px;
  color: #343a40;
  text-decoration: none;
  overflow-wrap: anywhere;
}

#TOC a:hover {
  background: #ebe7dc;
  color: #111;
}

#TOC a.active {
  background: var(--accent-soft);
  color: #075e56;
  font-weight: 700;
}

.function-hint {
  margin-top: 7px;
  color: #0f766e;
  font-size: 12px;
}

.content {
  min-height: 100vh;
  margin-left: var(--sidebar-width);
  padding: 36px 52px 80px;
}

.content article {
  max-width: 980px;
  margin: 0 auto;
}

.content h1,
.content h2,
.content h3,
.content h4,
.content h5,
.content h6 {
  line-height: 1.35;
  scroll-margin-top: 18px;
}

.content h1 {
  margin: 0 0 28px;
  font-size: 34px;
}

.content h2 {
  margin: 48px 0 18px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
  font-size: 28px;
}

.content h3 {
  margin: 36px 0 14px;
  color: #145b55;
  font-size: 23px;
}

.content h4 {
  margin: 28px 0 10px;
  padding-left: 10px;
  border-left: 4px solid var(--accent);
  font-size: 19px;
}

.content h5 {
  margin: 24px 0 8px;
  font-size: 17px;
}

.content h6 {
  margin: 20px 0 8px;
  color: #444;
  font-size: 15px;
}

.content p {
  margin: 12px 0;
}

.content a {
  color: #096e65;
}

.content code {
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--code-bg);
  font-family: Consolas, "Cascadia Mono", monospace;
  font-size: 0.92em;
}

.content pre {
  overflow-x: auto;
  padding: 15px 17px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #f4f2eb;
  line-height: 1.55;
}

.content pre code {
  padding: 0;
  background: transparent;
}

.content blockquote {
  margin: 18px 0;
  padding: 4px 16px;
  border-left: 4px solid #d49b32;
  background: #fff7e7;
  color: #53462f;
}

.content table {
  display: block;
  width: 100%;
  overflow-x: auto;
  border-collapse: collapse;
}

.content th,
.content td {
  padding: 8px 10px;
  border: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}

.content th {
  background: #efebe1;
}

.content img {
  max-width: 100%;
  height: auto;
}

.content .fn-ref {
  padding: 0 2px;
  border-radius: 3px;
  color: #0b6e64;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}

.content .fn-ref:hover,
.content .fn-ref:focus {
  background: var(--accent-soft);
  text-decoration-style: solid;
}

.content .fn-ref-choice {
  cursor: help;
}

.content .jump-ref {
  padding: 0 2px;
  border-radius: 3px;
  color: #9a5b00;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}

.content .jump-ref:hover,
.content .jump-ref:focus {
  background: #ffedc2;
  text-decoration-style: solid;
}

.content .return-ref {
  display: inline;
  margin: 0;
  padding: 0 2px;
  border: 0;
  border-radius: 3px;
  background: transparent;
  color: #a33a2b;
  font: inherit;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}

.content .return-ref:hover,
.content .return-ref:focus {
  background: #ffe0d9;
  text-decoration-style: solid;
}

.source-manifest {
  margin: 14px 0 24px;
  padding: 12px 14px;
  border: 1px solid #e2d5b9;
  border-left: 4px solid #d49b32;
  border-radius: 6px;
  background: #fff9ed;
}

.source-manifest h4 {
  margin: 0 0 6px;
  padding: 0;
  border: 0;
  color: #6d4b16;
  font-size: 15px;
}

.source-manifest p {
  margin: 4px 0 8px;
  color: #6f5a36;
  font-size: 13px;
}

.source-manifest ul {
  margin: 0;
  padding-left: 18px;
}

.source-manifest li {
  margin: 3px 0;
}

.source-manifest code {
  background: #f5ead3;
  color: #5b4219;
}

.content pre .fn-ref {
  color: #075e56;
}

.jump-status {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 40;
}

.jump-status[hidden] {
  display: none;
}

#fnBackButton {
  padding: 9px 13px;
  border: 1px solid #b9d8d2;
  border-radius: 6px;
  background: #f1fbf8;
  color: #075e56;
  font: inherit;
  cursor: pointer;
  box-shadow: 0 5px 16px rgba(15, 118, 110, 0.12);
}

#fnBackButton:hover {
  background: var(--accent-soft);
}

.fn-chooser {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(24, 28, 27, 0.42);
}

.fn-chooser[hidden] {
  display: none;
}

.fn-chooser-panel {
  width: min(680px, 100%);
  max-height: min(70vh, 640px);
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fffdf9;
  box-shadow: 0 20px 50px rgba(20, 28, 26, 0.25);
}

.fn-chooser-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.fn-chooser-head h3 {
  margin: 0;
  color: var(--text);
  font-size: 18px;
}

#fnChooserClose {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: #f7f4ed;
  color: var(--text);
  font: inherit;
  cursor: pointer;
}

.fn-chooser-list {
  max-height: calc(70vh - 64px);
  overflow: auto;
  padding: 8px;
}

.fn-choice-item {
  display: block;
  width: 100%;
  margin: 4px 0;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: #faf8f2;
  color: var(--text);
  text-align: left;
  font: inherit;
  cursor: pointer;
}

.fn-choice-item:hover,
.fn-choice-item:focus {
  border-color: #9fcfc7;
  background: var(--accent-soft);
}

.menu-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 50;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fffdf9;
  color: var(--text);
  font: inherit;
  cursor: pointer;
}

@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
    box-shadow: 8px 0 24px rgba(35, 40, 45, 0.15);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .content {
    margin-left: 0;
    padding: 70px 18px 60px;
  }

  .menu-toggle {
    display: block;
  }

  .content h1 {
    font-size: 28px;
  }

  .content h2 {
    font-size: 24px;
  }

  .content h3 {
    font-size: 21px;
  }

  .function-hint {
    font-size: 12px;
  }

  .jump-status {
    right: 12px;
    bottom: 12px;
  }
}
</style>
</head>
<body>
<button class="menu-toggle" id="menuToggle" type="button">目录</button>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>Ebook 项目代码详解</h1>
    <p>点击左侧条目，右侧阅读对应模块或函数。</p>
    <p class="function-hint" id="functionHint">正文中的函数名也可以点击跳转。</p>
  </div>
  <div class="search-wrap">
    <input id="tocSearch" type="search" placeholder="搜索模块、函数或关键字">
  </div>
  <div class="term-search-wrap">
    <label for="termSearch">术语/函数解释</label>
    <input id="termSearch" type="search" placeholder="例如 UiBus、Router、Presenter">
    <div class="term-results" id="termResults"></div>
  </div>
  <div class="toc-scroll">
    <nav id="TOC" role="doc-toc">
$table-of-contents$
    </nav>
  </div>
</aside>
<main class="content">
  <article>
$body$
  </article>
</main>
<div class="jump-status" id="jumpStatus" hidden>
  <button id="fnBackButton" type="button">← 返回上一个位置</button>
</div>
<div class="fn-chooser" id="fnChooser" hidden>
  <div class="fn-chooser-panel" role="dialog" aria-modal="true" aria-labelledby="fnChooserTitle">
    <div class="fn-chooser-head">
      <h3 id="fnChooserTitle">选择要阅读的函数</h3>
      <button id="fnChooserClose" type="button">关闭</button>
    </div>
    <div class="fn-chooser-list" id="fnChooserList"></div>

</div>

  function normalizeSectionNumber(text) {
    const match = text.trim().match(/^(\d+(?:\.\d+)?)/);
    return match ? match[1] : "";
  }

  function insertSourceManifests() {
    const moduleHeadings = Array.from(article.querySelectorAll("h2[id], h3[id]"));
    moduleHeadings.forEach(function (heading) {
      const sectionNumber = normalizeSectionNumber(heading.textContent);
      const files = sourceGroups[sectionNumber];
      if (!files || heading.nextElementSibling && heading.nextElementSibling.classList.contains("source-manifest")) {
        return;
      }

      const box = document.createElement("div");
      box.className = "source-manifest";

      const title = document.createElement("h4");
      title.textContent = "对应源码文件";
      box.appendChild(title);

      const note = document.createElement("p");
      note.textContent = "阅读顺序：按下面文件从上到下整理；每个文件内部按函数在源码中出现的先后顺序阅读。";
      box.appendChild(note);

      const list = document.createElement("ul");
      files.forEach(function (file) {
        const item = document.createElement("li");
        const code = document.createElement("code");
        code.textContent = file;
        item.appendChild(code);
        list.appendChild(item);
      });
      box.appendChild(list);

      heading.insertAdjacentElement("afterend", box);
    });
  }

  const functionSearchEntries = [];
  const headingSearchEntries = [];
  const documentSearchEntries = [];
  let searchEntriesBuilt = false;
  const termStopWords = new Set([
    "const", "void", "bool", "int", "char", "float", "double", "auto", "static",
    "return", "if", "else", "for", "while", "switch", "case", "break", "continue",
    "true", "false", "nullptr", "this", "new", "delete", "struct", "class", "public",
    "private", "protected", "namespace", "using", "include", "define", "sizeof"
  ]);
  let sectionAnchorMap = null;

  function getSectionAnchorMap() {
    if (!sectionAnchorMap) {
      sectionAnchorMap = buildSectionAnchorMap();
    }
    return sectionAnchorMap;
  }

  function findNearestHeading(element) {
    let node = element;
    while (node && node !== article) {
      let previous = node.previousElementSibling;
      while (previous) {
        if (/^H[1-6]/.test(previous.tagName)) {
          return previous;
        }
        const nested = previous.querySelector("h1, h2, h3, h4, h5, h6");
        if (nested) {
          return nested;
        }
        previous = previous.previousElementSibling;
      }
      node = node.parentElement;
    }
    return article.querySelector("h1, h2, h3, h4, h5, h6");
  }

  function buildDocumentSearchIndex() {
    const codeElements = Array.from(article.querySelectorAll("code"));
    let spotIndex = 0;

    codeElements.forEach(function (code) {
      const text = code.textContent || "";
      const target = code.closest("pre, p, li, td, th, blockquote") || code;
      if (!target.id) {
        spotIndex += 1;
        target.id = "term-spot-" + spotIndex;
      }

      const heading = findNearestHeading(target);
      const headingText = heading ? heading.textContent.trim() : "正文";
      const snippet = text.replace(/\s+/g, " ").trim().slice(0, 120);
      const seen = new Set();
      const pattern = /[A-Za-z_][A-Za-z0-9_]*(?:::[A-Za-z_][A-Za-z0-9_]*)*(?:\s*\([^()]*\))?/g;
      let match;

      while ((match = pattern.exec(text)) !== null) {
        const term = match[0].replace(/\s+/g, "");
        const lower = term.toLowerCase();
        if (term.length < 2 || termStopWords.has(lower) || seen.has(term)) {
          continue;
        }
        seen.add(term);
        documentSearchEntries.push({
          term: term,
          aliases: headingText + " " + snippet,
          desc: "出现在：" + headingText + (snippet ? "。代码上下文：" + snippet : "。"),
          targetId: target.id,
          rank: 3
        });
      }
    });
  }

  function buildFunctionSearchEntries() {
    if (searchEntriesBuilt) {
      return;
    }

    Array.from(article.querySelectorAll("h2[id], h3[id], h4[id], h5[id], h6[id]")).forEach(function (heading) {
      headingSearchEntries.push({
        term: heading.textContent.trim(),
        aliases: "章节 小节",
        desc: "查看这个章节或小节的解释。",
        targetId: heading.id,
        rank: 2
      });

      const matches = heading.textContent.match(/(?:[A-Za-z_][A-Za-z0-9_]*::)*[A-Za-z_][A-Za-z0-9_]*\s*\([^()]*\)/g);
      if (!matches) {
        return;
      }
      const seen = new Set();
      matches.forEach(function (match) {
        const name = match.replace(/\s+/g, "");
        if (seen.has(name)) {
          return;
        }
        seen.add(name);
        functionSearchEntries.push({
          term: name,
          aliases: heading.textContent.trim(),
          desc: "函数解释：" + heading.textContent.trim(),
          targetId: heading.id,
          rank: 1
        });
      });
    });
    buildDocumentSearchIndex();
    searchEntriesBuilt = true;
  }

  function activateTermEntry(entry, trigger) {
    const targetIds = [];
    if (entry.targetId) {
      targetIds.push(entry.targetId);
    }
    (entry.targets || []).forEach(function (number) {
      const id = getSectionAnchorMap().get(number);
      if (id && targetIds.indexOf(id) < 0) {
        targetIds.push(id);
      }
    });

    if (!targetIds.length) {
      return;
    }

    pushJumpLocation();
    if (targetIds.length === 1) {
      window.location.hash = targetIds[0];
      const targetLink = linkById.get(targetIds[0]);
      if (targetLink) {
        setActive(targetLink);
      }
    } else {
      openFunctionChooser(targetIds, trigger);
    }

    if (window.matchMedia("(max-width: 900px)").matches) {
      sidebar.classList.remove("open");
    }
  }

  function renderTermResults() {
    const query = termSearch.value.trim().toLowerCase();
    buildFunctionSearchEntries();
    const allEntries = glossaryTerms.concat(functionSearchEntries, headingSearchEntries, documentSearchEntries);
    const uniqueEntries = new Map();
    allEntries.forEach(function (entry) {
      const key = entry.term.toLowerCase() + "|" + (entry.targetId || (entry.targets || []).join(","));
      const previous = uniqueEntries.get(key);
      if (!previous || (entry.rank || 0) < (previous.rank || 0)) {
        uniqueEntries.set(key, entry);
      }
    });
    const entries = Array.from(uniqueEntries.values());
    let results;

    if (!query) {
      termResults.textContent = "";
      return;
    } else {
      results = entries.filter(function (entry) {
        const haystack = (entry.term + " " + (entry.aliases || "") + " " + entry.desc).toLowerCase();
        return haystack.includes(query);
      }).sort(function (a, b) {
        const aStarts = a.term.toLowerCase().startsWith(query) ? 0 : 1;
        const bStarts = b.term.toLowerCase().startsWith(query) ? 0 : 1;
        return aStarts - bStarts || (a.rank || 0) - (b.rank || 0) || a.term.localeCompare(b.term, "zh-CN");
      }).slice(0, 40);
    }

    termResults.textContent = "";
    if (!results.length) {
      const empty = document.createElement("div");
      empty.className = "term-empty";
      empty.textContent = "没有找到匹配的术语或函数。";
      termResults.appendChild(empty);
      return;
    }

    results.forEach(function (entry) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "term-result";

      const title = document.createElement("strong");
      title.textContent = entry.term;
      button.appendChild(title);

      const desc = document.createElement("span");
      desc.textContent = entry.desc;
      button.appendChild(desc);

      button.addEventListener("click", function () {
        activateTermEntry(entry, button);
      });
      termResults.appendChild(button);
    });
  }

  links.forEach(function (link) {
    const id = decodeURIComponent(link.getAttribute("href").slice(1));
    const heading = document.getElementById(id);
    if (heading) {
      linkById.set(id, link);
    }
  });

  function escapeRegExp(text) {
    return text.replace(/[\\^.*+?()[\]{}|]/g, function (match) {
      return "\\" + match;
    });
  }

  function buildFunctionIndex() {
    const headings = Array.from(article.querySelectorAll("h2[id], h3[id], h4[id], h5[id], h6[id]"));
    const candidates = new Map();

    headings.forEach(function (heading) {
      const rawHeading = heading.textContent.trim();
      const matches = rawHeading.match(/(?:[A-Za-z_][A-Za-z0-9_]*::)*[A-Za-z_][A-Za-z0-9_]*\s*\([^()]*\)/g);
      if (!matches) {
        return;
      }

      matches.forEach(function (match, matchIndex) {
        const fullName = match.replace(/\s+/g, "");
        const isPrimary = matchIndex === 0 && rawHeading.indexOf(match) === rawHeading.search(/[A-Za-z_]/);
        if (!fullName.includes("::") && !isPrimary) {
          return;
        }
        if (!candidates.has(fullName)) {
          candidates.set(fullName, []);
        }
        candidates.get(fullName).push({ id: heading.id, weight: 3, heading: rawHeading });

        if (fullName.includes("::")) {
          const openParen = fullName.indexOf("(");
          const baseName = openParen >= 0 ? fullName.slice(0, openParen) : fullName;
          const bareName = baseName.split("::").pop();
          const bareCall = bareName + "()";
          if (!candidates.has(bareCall)) {
            candidates.set(bareCall, []);
          }
          candidates.get(bareCall).push({ id: heading.id, weight: 2, heading: rawHeading });
        }
      });
    });

    const aliases = [];
    const aliasTargets = new Map();
    candidates.forEach(function (targets, alias) {
      const unique = new Map();
      targets.forEach(function (target) {
        const previous = unique.get(target.id);
        if (!previous || target.weight > previous.weight) {
          unique.set(target.id, target);
        }
      });
      const list = Array.from(unique.values());
      if (list.length > 0) {
        list.sort(function (a, b) {
          return b.weight - a.weight || a.heading.localeCompare(b.heading, "zh-CN");
        });
        aliases.push(alias);
        aliasTargets.set(alias, list);
      }
    });

    aliases.sort(function (a, b) {
      return b.length - a.length;
    });

    return { aliases: aliases, targets: aliasTargets };
  }

  function linkifyTextNode(node, index) {
    const text = node.nodeValue;
    if (!text || !text.trim() || !index.aliases.length) {
      return;
    }

    const pattern = new RegExp("(" + index.aliases.map(escapeRegExp).join("|") + ")", "g");
    let match;
    let lastIndex = 0;
    const fragment = document.createDocumentFragment();
    let changed = false;

    while ((match = pattern.exec(text)) !== null) {
      const start = match.index;
      const end = start + match[0].length;
      const before = start > 0 ? text[start - 1] : "";
      const after = end < text.length ? text[end] : "";
      const blocked = /[A-Za-z0-9_:]/.test(before) || /[A-Za-z0-9_:]/.test(after);

      if (blocked) {
        continue;
      }

      const targets = index.targets.get(match[0]);
      if (!targets || !targets.length) {
        continue;
      }

      fragment.appendChild(document.createTextNode(text.slice(lastIndex, start)));
      const link = document.createElement("a");
      link.className = "fn-ref";
      link.textContent = match[0];
      if (targets.length === 1) {
        link.href = "#" + targets[0].id;
        link.title = "跳转到 " + targets[0].heading;
        link.setAttribute("data-fn-target", targets[0].id);
      } else {
        link.href = "#";
        link.className += " fn-ref-choice";
        link.title = "有多个同名函数，点击选择";
        link.setAttribute("data-fn-targets", targets.map(function (target) {
          return target.id;
        }).join("|"));
      }
      fragment.appendChild(link);
      lastIndex = end;
      changed = true;
    }

    if (!changed) {
      return;
    }

    fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
    node.parentNode.replaceChild(fragment, node);
  }

  function buildSectionAnchorMap() {
    const sectionAnchors = new Map();
    Array.from(article.querySelectorAll("h2[id], h3[id], h4[id], h5[id], h6[id]")).forEach(function (heading) {
      const match = heading.textContent.trim().match(/^(\d+(?:\.\d+)?)/);
      if (match && !sectionAnchors.has(match[1])) {
        sectionAnchors.set(match[1], heading.id);
      }
    });
    return sectionAnchors;
  }

  function linkifyMarkers() {
    if (!article) {
      return;
    }

    const sectionAnchors = buildSectionAnchorMap();

    const markerPattern = /\[跳到\s+([^\]]+)\]|\[返回点\]/g;

    function replaceMarkerTextNode(node) {
      const text = node.nodeValue;
      if (!text || (!text.includes("[跳到") && !text.includes("[返回点]"))) {
        return;
      }

      let match;
      let lastIndex = 0;
      let changed = false;
      const fragment = document.createDocumentFragment();

      while ((match = markerPattern.exec(text)) !== null) {
        const markerText = match[0];
        const jumpText = match[1];
        let replacement = null;

        if (jumpText) {
          const numbers = jumpText.match(/\d+(?:\.\d+)?/g) || [];
          const targetIds = [];
          numbers.forEach(function (number) {
            const id = sectionAnchors.get(number);
            if (id && targetIds.indexOf(id) < 0) {
              targetIds.push(id);
            }
          });

          if (targetIds.length > 0) {
            replacement = document.createElement("a");
            replacement.className = "jump-ref";
            replacement.textContent = markerText;
            if (targetIds.length === 1) {
              replacement.href = "#" + targetIds[0];
              replacement.title = "跳转到 " + jumpText;
              replacement.setAttribute("data-section-target", targetIds[0]);
            } else {
              replacement.href = "#";
              replacement.className += " jump-ref-choice";
              replacement.title = "有多个跳转目标，点击选择";
              replacement.setAttribute("data-section-targets", targetIds.join("|"));
            }
          }
        } else {
          replacement = document.createElement("button");
          replacement.type = "button";
          replacement.className = "return-ref";
          replacement.textContent = "[返回点]";
          replacement.title = "返回上一个跳转位置";
        }

        if (!replacement) {
          continue;
        }

        fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        fragment.appendChild(replacement);
        lastIndex = match.index + markerText.length;
        changed = true;
      }

      if (!changed) {
        return;
      }

      fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
      node.parentNode.replaceChild(fragment, node);
    }

    const markerWalker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue || (!node.nodeValue.includes("[跳到") && !node.nodeValue.includes("[返回点]"))) {
          return NodeFilter.FILTER_REJECT;
        }
        if (!node.parentElement || node.parentElement.closest("a, button, script, style")) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });

    const markerNodes = [];
    while (markerWalker.nextNode()) {
      markerNodes.push(markerWalker.currentNode);
    }
    markerNodes.forEach(replaceMarkerTextNode);
  }

  function linkifyFunctionReferences() {
    if (!article) {
      return;
    }

    const index = buildFunctionIndex();
    const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue || !node.nodeValue.trim()) {
          return NodeFilter.FILTER_REJECT;
        }
        const parent = node.parentElement;
        if (!parent || parent.closest("a, h1, h2, h3, h4, h5, h6, script, style")) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });

    const nodes = [];
    while (walker.nextNode()) {
      nodes.push(walker.currentNode);
    }

    nodes.forEach(function (node) {
      linkifyTextNode(node, index);
    });

    const count = article.querySelectorAll("a.fn-ref").length;
    functionHint.textContent = "已建立 " + count + " 处函数跳转，点击正文中的绿色函数名即可。";
  }

  function showJumpStatus() {
    jumpStatus.hidden = jumpStack.length === 0;
  }

  function pushJumpLocation() {
    jumpStack.push({
      scrollY: window.scrollY,
      hash: window.location.hash
    });
    showJumpStatus();
  }

  function closeFunctionChooser() {
    fnChooser.hidden = true;
    fnChooserList.textContent = "";
  }

  function openFunctionChooser(targetIds, sourceLink) {
    fnChooserList.textContent = "";
    targetIds.forEach(function (targetId) {
      const heading = document.getElementById(targetId);
      if (!heading) {
        return;
      }

      const choice = document.createElement("button");
      choice.type = "button";
      choice.className = "fn-choice-item";
      choice.textContent = heading.textContent.trim();
      choice.addEventListener("click", function () {
        closeFunctionChooser();
        window.location.hash = targetId;
        const targetLink = linkById.get(targetId);
        if (targetLink) {
          setActive(targetLink);
        }
      });
      fnChooserList.appendChild(choice);
    });

    if (!fnChooserList.children.length) {
      return;
    }

    fnChooser.hidden = false;
    const firstChoice = fnChooserList.querySelector("button");
    if (firstChoice) {
      firstChoice.focus();
    }
  }

  const headings = Array.from(document.querySelectorAll("article h1[id], article h2[id], article h3[id], article h4[id], article h5[id], article h6[id]"));
  let activeLink = null;

  function setActive(link) {
    if (activeLink === link) {
      return;
    }
    if (activeLink) {
      activeLink.classList.remove("active");
    }
    activeLink = link || null;
    if (activeLink) {
      activeLink.classList.add("active");
      const rect = activeLink.getBoundingClientRect();
      if (rect.top < 0 || rect.bottom > window.innerHeight) {
        activeLink.scrollIntoView({ block: "center" });
      }
    }
  }

  function updateActive() {
    let current = null;
    for (const heading of headings) {
      if (heading.getBoundingClientRect().top <= 130) {
        current = heading;
      } else {
        break;
      }
    }
    setActive(current ? linkById.get(current.id) : null);
  }

  let ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) {
      return;
    }
    ticking = true;
    window.requestAnimationFrame(function () {
      updateActive();
      ticking = false;
    });
  }, { passive: true });

  links.forEach(function (link) {
    link.addEventListener("click", function () {
      setActive(link);
      if (window.matchMedia("(max-width: 900px)").matches) {
        sidebar.classList.remove("open");
      }
    });
  });

  article.addEventListener("click", function (event) {
    const returnRef = event.target.closest("button.return-ref");
    if (returnRef) {
      event.preventDefault();
      returnToPreviousLocation();
      return;
    }

    const sectionLink = event.target.closest("a.jump-ref");
    if (sectionLink) {
      pushJumpLocation();
      const multiTargets = sectionLink.getAttribute("data-section-targets");
      if (multiTargets) {
        event.preventDefault();
        openFunctionChooser(multiTargets.split("|").filter(Boolean), sectionLink);
        return;
      }

      const targetId = sectionLink.getAttribute("data-section-target");
      const targetLink = linkById.get(targetId);
      if (targetLink) {
        setActive(targetLink);
      }
      return;
    }

    const functionLink = event.target.closest("a.fn-ref");
    if (!functionLink) {
      return;
    }

    pushJumpLocation();
    const multiTargets = functionLink.getAttribute("data-fn-targets");
    if (multiTargets) {
      event.preventDefault();
      openFunctionChooser(multiTargets.split("|").filter(Boolean), functionLink);
      return;
    }

    const targetId = functionLink.getAttribute("data-fn-target");
    const targetLink = linkById.get(targetId);
    if (targetLink) {
      setActive(targetLink);
    }
  });

  function returnToPreviousLocation() {
    const previous = jumpStack.pop();
    if (!previous) {
      showJumpStatus();
      return;
    }
    window.scrollTo({ top: previous.scrollY, behavior: "smooth" });
    if (previous.hash) {
      history.replaceState(null, "", previous.hash);
    }
    showJumpStatus();
  }

  fnBackButton.addEventListener("click", returnToPreviousLocation);

  fnChooserClose.addEventListener("click", closeFunctionChooser);

  fnChooser.addEventListener("click", function (event) {
    if (event.target === fnChooser) {
      closeFunctionChooser();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !fnChooser.hidden) {
      closeFunctionChooser();
    }
  });

  toggle.addEventListener("click", function () {
    sidebar.classList.toggle("open");
  });

  search.addEventListener("input", function () {
    const query = search.value.trim().toLowerCase();
    const items = Array.from(document.querySelectorAll("#TOC li"));
    items.forEach(function (item) {
      const ownLink = item.querySelector(":scope > a");
      const ownText = ownLink ? ownLink.textContent.toLowerCase() : "";
      const childMatch = Array.from(item.querySelectorAll(":scope li > a")).some(function (link) {
        return link.textContent.toLowerCase().includes(query);
      });
      item.hidden = Boolean(query) && !ownText.includes(query) && !childMatch;
    });
  });

  termSearch.addEventListener("input", renderTermResults);

  insertSourceManifests();
  linkifyMarkers();
  linkifyFunctionReferences();
  const initialTermQuery = new URLSearchParams(window.location.search).get("q");
  if (initialTermQuery) {
    termSearch.value = initialTermQuery;
  }
  renderTermResults();
  updateActive();
}());
</script>
</body>
</html>
